<!doctype html>
<meta charset="utf-8">
<!-- 4DGSX html panel: the stadium score panel. A DESIGN file — edit freely.
     The host feeds it data by postMessage (see docs/4DGSX.md):
       {type:"4dgsx:init", hud}                     once
       {type:"4dgsx:tick", t, clock, score, playing} ~4 Hz
       {type:"4dgsx:event", event}                  when events fire
     No network, no host DOM access: panels run sandboxed. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden;
               font-family: -apple-system, "Segoe UI", sans-serif; }
  #panel { height: 100%; display: flex; flex-direction: column;
           background: linear-gradient(180deg, #171c28 0%, #0d1018 100%);
           border: 3px solid #2c3550; border-radius: 18px;
           box-sizing: border-box; color: #eef1f8; }
  #row { flex: 1; display: flex; align-items: center; justify-content: center;
         gap: 26px; padding: 0 22px; }
  .side { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .kit { width: 22px; height: 22px; border-radius: 6px; flex: none;
         box-shadow: 0 0 14px rgba(255,255,255,.12); }
  .code { font-size: 34px; font-weight: 800; letter-spacing: .06em; }
  #score { font-size: 54px; font-weight: 900; font-variant-numeric: tabular-nums;
           display: flex; gap: 14px; align-items: center; }
  #score .g { transition: transform .3s, color .3s; }
  #score .flash { transform: scale(1.45); color: #ffd479; }
  #clock { text-align: center; font-size: 20px; font-weight: 700;
           color: #ffd479; font-variant-numeric: tabular-nums;
           padding-bottom: 8px; letter-spacing: .12em; }
  #strip { position: absolute; inset: 0; border-radius: 15px; opacity: 0;
           pointer-events: none; transition: opacity .25s;
           background: radial-gradient(ellipse at center,
                       rgba(255,212,121,.28), transparent 70%); }
</style>
<div id="panel">
  <div id="strip"></div>
  <div id="row">
    <div class="side"><span class="kit" id="kitA"></span><span class="code" id="codeA">—</span></div>
    <div id="score"><span class="g" id="ga">0</span><span>–</span><span class="g" id="gb">0</span></div>
    <div class="side"><span class="code" id="codeB">—</span><span class="kit" id="kitB"></span></div>
  </div>
  <div id="clock">0:00</div>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const css = c => `rgb(${c.slice(0, 3).map(v => Math.round(v * 255)).join(",")})`;
let last = { a: 0, b: 0 };
addEventListener("message", ev => {
  const m = ev.data || {};
  if (m.type === "4dgsx:init" && m.hud) {
    const [A, B] = m.hud.teams;
    $("codeA").textContent = A.code; $("kitA").style.background = css(A.color);
    $("codeB").textContent = B.code; $("kitB").style.background = css(B.color);
  } else if (m.type === "4dgsx:tick") {
    $("clock").textContent = m.clock;
    for (const [k, el] of [["a", "ga"], ["b", "gb"]]) {
      $(el).textContent = m.score[k];
      if (m.score[k] !== last[k]) {          // goal pop
        $(el).classList.add("flash");
        setTimeout(() => $(el).classList.remove("flash"), 900);
      }
    }
    last = { ...m.score };
  } else if (m.type === "4dgsx:event" && m.event.type === "goal") {
    $("strip").style.opacity = 1;
    setTimeout(() => $("strip").style.opacity = 0, 1600);
  }
});
</script>
